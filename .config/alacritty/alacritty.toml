[general]
import = ["~/.config/alacritty/themes/calido.toml"]
live_config_reload = true

[window]
dimensions = { columns = 112, lines = 28 }
padding = { x = 32, y = 32 }

[font]
size = 8

[font.normal]
family = "CommitMono"
style = "Regular"

[font.bold]
family = "CommitMono"
style = "Bold"

[font.italic]
family = "CommitMono"
style = "Italic"

[font.bold_italic]
family = "CommitMono"
style = "Bold Italic"
